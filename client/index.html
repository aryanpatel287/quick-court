<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Welcome Back</title>

        <!-- Google Fonts: Bodoni Moda (headings) and Plus Jakarta Sans (body) -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <script>
            (function () {
                try {
                    var theme = localStorage.getItem('app-theme');
                    if (!theme || (theme !== 'dark' && theme !== 'light' && theme !== 'system')) {
                        theme = 'system';
                        localStorage.setItem('app-theme', 'system');
                    }
                    var resolvedTheme = theme;
                    if (theme === 'system') {
                        var isDark =
                            window.matchMedia &&
                            window.matchMedia('(prefers-color-scheme: dark)').matches;
                        resolvedTheme = isDark ? 'dark' : 'light';
                    }
                    document.documentElement.setAttribute('data-theme', resolvedTheme);
                    document.documentElement.style.colorScheme = resolvedTheme;
                } catch (e) {}
            })();
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.jsx"></script>
    </body>
</html>
